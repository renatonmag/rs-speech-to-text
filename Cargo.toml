[package]
name = "rs-speech-to-text"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
cpal = "0.18.2"
dirs = "7.0.0"
gpui-kit = "0.7"
hound = "3.5.1"
rig-core = { version = "0.43", features = ["reqwest"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread"] }
uuid = { version = "1.26.1", features = ["v4", "serde"] }
